name: Cross-Origin Storage build (macOS / Linux)
# GitHub sometimes keeps showing a workflow's *first-ever* `name:` in the
# Actions UI/API even after the YAML's own `name:` is edited -- `run-name:` is
# evaluated fresh on every run and isn't subject to that staleness, so it's the
# reliable way to keep each run's own displayed title accurate.
run-name: Cross-Origin Storage build (macOS / Linux)

# Builds this branch's WebKit and publishes MiniBrowser plus the frameworks it
# needs as a GitHub Release, so testers can try navigator.crossOriginStorage
# without building WebKit themselves. This is a personal fork's workflow for one
# in-development feature branch, not part of WebKit's own CI.
#
# Manual dispatch only. A full WebKit build is 45 minutes to several hours per
# platform with no incremental caching, so there's no reason to pay that on
# every commit -- trigger it from the Actions tab or `gh workflow run` when you
# actually want builds to hand out.
#
# ---------------------------------------------------------------------------
# Platform coverage, and why it stops where it does
#
# WebKit has more ports than macOS. The ones that produce something a tester can
# actually double-click and browse with are macOS (MiniBrowser.app), WebKitGTK,
# and WinCairo; WPE is buildable here too but targets embedded/headless use and
# has no comparable desktop browser UI, and the iOS/visionOS/PlayStation ports
# either can't be distributed this way or need a non-public SDK. So this
# workflow covers macOS arm64, macOS x86_64, and Linux GTK x86_64.
#
# NONE OF THESE LEGS HAS BEEN RUN YET. Treat all three as best-effort until a
# run has actually gone green -- see the disk-space note below, which is the
# most likely reason a leg fails.
#
# ---------------------------------------------------------------------------
# The disk-space problem, stated plainly
#
# A GitHub-hosted runner gives you roughly 14 GB free. A WebKit build tree is
# much larger than that: the tree this workflow was written against measured
# 33 GB total (6.8 GB WebCore.build, 5.4 GB WebKit.build, 5.3 GB precompiled
# headers, 3.2 GB JavaScriptCore.build, 2.3 GB XCBuildData, 5.7 GB of actual
# products). That figure is inflated by ~20 incremental rebuilds, so a single
# clean build will be smaller -- but probably not 14 GB smaller.
#
# The steps below reclaim what they can and turn off dSYM generation, which is
# pure overhead for a test build. If a leg still dies with a disk error, the
# realistic options are a larger runner or a self-hosted one; there is no
# clever flag that makes a WebKit build small.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        default: all
        options: [all, macos-arm64, macos-x86_64, linux-gtk]

permissions:
  contents: write

jobs:
  # The obvious way to honour the `platforms` input would be a job-level
  # `if: inputs.platforms == 'all' || inputs.platforms == matrix.id`, but the
  # `matrix` context isn't available there (only `github`, `inputs`, `needs`
  # and `vars` are), and using it makes the whole file fail to parse -- no jobs
  # run at all. So the selection happens up front instead: this job emits the
  # matrix that `build` then expands, which also avoids booting runners for
  # platforms that were only going to skip.
  select:
    name: Select platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Filter the platform list by the dispatch input
        id: select
        env:
          WANTED: ${{ inputs.platforms }}
        run: |
          set -eu
          # The macOS images must be `macos-26`/`macos-26-intel`, not the
          # `macos-15` pair: WebKit's own `webkitdirs.pm` requires Xcode 26.2
          # or later, and the macOS 15 images top out at Xcode 16.4. That is
          # not a soft warning -- WTF's `RetainRef.h` applies RETURNS_NONNULL
          # to a dependent return type, which older clang rejects outright, so
          # the build dies in a WebKit header long before reaching any COS
          # code.
          #
          # The Linux image has a floor of its own: WebKitCommon.cmake requires
          # GCC 12.2 or newer, and ubuntu-22.04 ships GCC 11.4, so that image
          # fails at configure time no matter which dependencies install.
          #
          # GitHub's Intel macOS runner label has changed more than once as
          # older images are retired. If `macos-26-intel` is rejected, check
          # the runner-images repo for what's currently offered before
          # assuming that leg is broken.
          include="$(jq -c --arg wanted "$WANTED" \
            'map(select($wanted == "all" or .id == $wanted))' <<'PLATFORMS'
          [
            {"name": "macOS arm64",      "id": "macos-arm64",  "os": "macos-26",        "port": "mac"},
            {"name": "macOS x86_64",     "id": "macos-x86_64", "os": "macos-26-intel",  "port": "mac"},
            {"name": "Linux GTK x86_64", "id": "linux-gtk",    "os": "ubuntu-24.04",    "port": "gtk"}
          ]
          PLATFORMS
          )"
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A hosted runner's own ceiling is 6 hours; this asks for all of it.
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select a new enough Xcode (macOS)
        if: matrix.port == 'mac'
        run: |
          set -eu
          # Pinning a literal `Xcode_26.6.app` would rot the moment the image
          # drops that version, and trusting the image default would fail
          # silently the moment GitHub moves it backwards. So: pick the newest
          # installed Xcode that still clears WebKit's floor, and make "none
          # qualifies" a loud failure here rather than a confusing compile
          # error inside <wtf/RetainRef.h>.
          minimum=26.2
          best=""
          bestVersion=""
          for app in /Applications/Xcode_*.app; do
            version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
              "$app/Contents/Info.plist" 2>/dev/null || true)"
            [ -n "$version" ] || continue
            [ "$(printf '%s\n%s\n' "$minimum" "$version" | sort -V | head -1)" = "$minimum" ] || continue
            if [ -z "$best" ] || \
               [ "$(printf '%s\n%s\n' "$bestVersion" "$version" | sort -V | tail -1)" = "$version" ]; then
              best="$app"
              bestVersion="$version"
            fi
          done
          if [ -z "$best" ]; then
            echo "::error::No installed Xcode is $minimum or newer, so WebKit cannot be built on this image."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "Selected Xcode $bestVersion at $best"
          sudo xcode-select -s "$best/Contents/Developer"
          echo "DEVELOPER_DIR=$best/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Reclaim disk space (Linux)
        if: matrix.port == 'gtk'
        run: |
          # The preinstalled Android/.NET/GHC/CodeQL toolchains are worth
          # ~25 GB on a stock Ubuntu runner and none of them is used here.
          # Removing them is the difference between this build fitting and
          # not, so failing to remove one is worth knowing about, but isn't
          # itself fatal -- hence `|| true` per entry rather than `set -e`.
          df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/share/swift || true
          sudo apt-get clean || true
          df -h /

      - name: Reclaim disk space (macOS)
        if: matrix.port == 'mac'
        run: |
          df -h /
          # iOS/tvOS/watchOS simulator runtimes are several GB each and this
          # build targets macOS only.
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes || true
          sudo rm -rf ~/Library/Developer/Xcode/iOS\ DeviceSupport || true
          df -h /

      - name: Install build dependencies (Linux)
        if: matrix.port == 'gtk'
        run: |
          set -eux
          # `Tools/glib/dependencies/apt` lists `git-svn` among the tools it
          # installs for `git-webkit`'s benefit, not for the build's. Ubuntu
          # 22.04's git-svn still declares `Depends: git (< 1:2.34.1-.)`,
          # while the hosted image ships git 2.54 from the git-core PPA, so
          # apt cannot satisfy it -- and because `install-dependencies` asks
          # for every package in one transaction, that single unsatisfiable
          # entry aborts the whole install ("held broken packages") rather
          # than just skipping itself. Dropping the line is narrower than
          # downgrading the runner's git, and nothing here compiles with it.
          sudo sed -i '/^[[:space:]]*git-svn[[:space:]]*$/d' Tools/glib/dependencies/apt
          # The image ships a prebaked apt index that is stale by the time any
          # given run starts, so the versions it names have often already been
          # superseded and their .deb URLs 404. install-dependencies does not
          # refresh it itself, and a 404 on any single package fails the whole
          # transaction, so refresh it here first.
          sudo apt-get update
          sudo Tools/gtk/install-dependencies
          sudo apt-get install -y ninja-build

      - name: Build
        env:
          # Debug symbols are dead weight for a hand-testing build and dSYM
          # generation is a large chunk of both time and disk.
          DEBUG_INFORMATION_FORMAT: dwarf
        run: |
          set -eux
          if [ "${{ matrix.port }}" = "mac" ]; then
            Tools/Scripts/build-webkit --release
          else
            # build-webkit turns on ENABLE_EXPERIMENTAL_FEATURES for the GTK
            # port, which makes ENABLE_THUNDER a hard requirement -- and Thunder
            # (the OCDM backend for encrypted media) is not packaged on Ubuntu,
            # so find_package(Thunder REQUIRED) aborts configuration. Nothing
            # about Cross-Origin Storage needs it: the feature is gated on its
            # own WebPreferences flag, not on experimental features.
            Tools/Scripts/build-webkit --gtk --release --cmakeargs="-DENABLE_THUNDER=OFF"
          fi

      - name: Package (macOS)
        if: matrix.port == 'mac'
        id: package-mac
        run: |
          set -eux
          out="CrossOriginStorage-WebKit-${{ matrix.id }}"
          mkdir -p "$out"

          # MiniBrowser.app is not self-contained: it resolves WebKit,
          # WebCore, JavaScriptCore and friends through DYLD_FRAMEWORK_PATH at
          # launch, and the auxiliary processes live in the .xpc bundles beside
          # them. Shipping the app alone produces something that launches and
          # then immediately fails to load any page, so copy the whole set.
          cp -R WebKitBuild/Release/MiniBrowser.app "$out/"
          cp -R WebKitBuild/Release/*.framework "$out/"
          cp -R WebKitBuild/Release/*.xpc "$out/" 2>/dev/null || true
          # The Public Hash List ships inside WebKit.framework's Resources, so
          # it comes along with the framework copy above -- but a missing list
          # fails closed silently (wildcard-scoped entries simply stop being
          # disclosed), so check rather than assume.
          test -f "$out/WebKit.framework/Versions/A/Resources/CrossOriginStoragePublicHashList.dat"

          # dSYMs are excluded deliberately: they roughly double the download
          # for no benefit to someone exercising the API from a web page.
          rm -rf "$out"/*.dSYM

          cat > "$out/run-minibrowser.sh" <<'LAUNCHER'
          #!/bin/sh
          # MiniBrowser has to be told where its frameworks are; without this it
          # will pick up the system WebKit instead, which is not this build.
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export DYLD_FRAMEWORK_PATH="$DIR"
          export DYLD_LIBRARY_PATH="$DIR"
          exec "$DIR/MiniBrowser.app/Contents/MacOS/MiniBrowser" "$@"
          LAUNCHER
          chmod +x "$out/run-minibrowser.sh"

          cat > "$out/README.txt" <<'READMETXT'
          Cross-Origin Storage test build of WebKit (MiniBrowser)

          Run ./run-minibrowser.sh -- not MiniBrowser.app directly, which would
          load the system WebKit rather than this build.

          macOS will refuse to open this the first time because it is unsigned
          and downloaded from the internet. Clear the quarantine flag first:

              xattr -dr com.apple.quarantine .

          navigator.crossOriginStorage is enabled by default in this build, so
          it is available immediately on any secure context (https:, or
          http://localhost). No flags to set.
          READMETXT

          tar -czf "$out.tar.gz" "$out"
          echo "path=$out.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Package (Linux)
        if: matrix.port == 'gtk'
        id: package-linux
        run: |
          set -eux
          out="CrossOriginStorage-WebKit-${{ matrix.id }}"
          mkdir -p "$out"

          # A GTK build's MiniBrowser links against the freshly built
          # libwebkit2gtk plus a long tail of system libraries, so this tarball
          # is only usable on a distribution close to the one it was built on
          # (Ubuntu 22.04 here). That is a real limitation of shipping a bare
          # tarball rather than a Flatpak, and is called out in the README.
          cp -R WebKitBuild/Release/bin "$out/" 2>/dev/null || true
          cp -R WebKitBuild/Release/lib "$out/" 2>/dev/null || true

          # The GTK/WPE build compiles in the Public Hash List's *installed*
          # path, which does not exist in an unpacked tarball -- and a missing
          # list fails closed silently, so wildcard-scoped entries would simply
          # never be disclosed with no diagnostic. Ship the file and point the
          # runtime override at it.
          cp Source/WebKit/Resources/CrossOriginStoragePublicHashList.dat "$out/"

          cat > "$out/run-minibrowser.sh" <<'LAUNCHER'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/lib:$LD_LIBRARY_PATH"
          export WEBKIT_CROSS_ORIGIN_STORAGE_PUBLIC_HASH_LIST="$DIR/CrossOriginStoragePublicHashList.dat"
          exec "$DIR/bin/MiniBrowser" "$@"
          LAUNCHER
          chmod +x "$out/run-minibrowser.sh"

          cat > "$out/README.txt" <<'READMETXT'
          Cross-Origin Storage test build of WebKitGTK (MiniBrowser)

          Run ./run-minibrowser.sh

          Built on Ubuntu 22.04 and dynamically linked against that release's
          system libraries. On a materially different distribution it will most
          likely fail to start with a missing-library error; building from
          source is the fallback there.

          navigator.crossOriginStorage is enabled by default in this build, so
          it is available immediately on any secure context (https:, or
          http://localhost). No flags to set.
          READMETXT

          tar -czf "$out.tar.gz" "$out"
          echo "path=$out.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Publish to the cross-origin-storage-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cross-origin-storage-latest
          name: Cross-Origin Storage (latest WebKit build)
          body: |
            Automated build of the `cross-origin-storage` branch at
            ${{ github.sha }}.

            `navigator.crossOriginStorage` is enabled by default in these
            builds, so it is available on any secure context with no flags to
            set. Each archive contains a `run-minibrowser.sh` launcher and a
            README; on macOS you will need to clear the quarantine flag
            (`xattr -dr com.apple.quarantine .`) because these builds are
            unsigned.

            These are throwaway builds of an in-development implementation of a
            draft WICG proposal, published so the API can be tried without
            building WebKit from source. They are not a WebKit release and are
            not signed, notarized, or supported.
          prerelease: true
          files: ${{ steps.package-mac.outputs.path || steps.package-linux.outputs.path }}
