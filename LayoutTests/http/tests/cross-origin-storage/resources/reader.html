<!DOCTYPE html>
<!--
Attempts to read a Cross-Origin Storage entry by hash from whatever origin this page is loaded on,
and reports what happened to its opener.
-->
<script>
async function run() {
    const parameters = new URLSearchParams(location.search);
    const value = parameters.get('value');

    try {
        const handle = await navigator.crossOriginStorage.requestFileHandle({ algorithm: 'SHA-256', value });
        const file = await handle.getFile();
        parent.postMessage({ result: 'read', text: await file.text() }, '*');
    } catch (error) {
        parent.postMessage({ result: 'error', name: error.name, message: error.message }, '*');
    }
}
run();
</script>
